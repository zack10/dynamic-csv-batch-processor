name: Large-file verification
on:
  schedule: [{ cron: '17 4 * * *' }]
  workflow_dispatch:
jobs:
  large-file:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B -ntp "-DlargeFileTest=true" "-DargLine=-Xmx256m" verify
